[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stt-services"
version = "0.1.0"
description = "Local Thai/English transcription with a CLI and durable job API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faster-whisper>=1.2.1,<2",
  # faster-whisper 1.2.1 calls metadata_errors, removed by PyAV 19.
  "av>=18,<19",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.8,<3",
  "psutil>=7,<8",
  "filelock>=3.18,<4",
  "rapidfuzz>=3.14,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-psutil>=7,<8"]

[project.scripts]
stt = "stt_services.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stt_services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = ["integration: requires downloaded Whisper weights and explicit opt-in"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/stt_services"]
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["av.*", "faster_whisper.*"]
ignore_missing_imports = true
